name: Update Dynamic Profile Banner

on:
  schedule:
    # 国际标准时间每 3 小时运行一次 (对应北京时间 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00, 24:00)
    - cron: '0 */3 * * *'
  workflow_dispatch: # 支持在 GitHub 仓库页面上手动点击触发

permissions:
  contents: write

jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Dynamic SVG Banner
        run: |
          python scripts/generate_banner.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add assets/dynamic-banner.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "🎨 Auto-update dynamic profile banner [skip ci]" && git push)
